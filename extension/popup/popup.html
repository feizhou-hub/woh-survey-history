<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Survey History Tracking</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 520px;
        max-height: 560px;
        margin: 0;
        padding: 14px 14px 16px;
        color: #1f1f1f;
        overflow-y: auto;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .subtitle {
        font-size: 12px;
        color: #666;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 8px;
        border: none;
        border-radius: 8px;
        background: #f3f3f3;
        color: #1f1f1f;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        font-size: 13px;
        margin: 4px 0 10px;
        min-height: 18px;
        color: #444;
      }
      .account-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .account-line:not(:has(> :not([hidden]))) { display: none; }
      .account {
        font-size: 12px;
        color: #333;
        font-weight: 600;
        min-width: 0;
      }
      .avg-badge {
        flex: none;
        width: 64px;
        height: 64px;
        margin-left: auto;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d4edda;
        color: #1f1f1f;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        box-shadow: inset 0 0 0 2px #b7dfc4;
      }
      .avg-badge.mid {
        background: #fff3cd;
        box-shadow: inset 0 0 0 2px #ffe08a;
      }
      .avg-badge.low {
        background: #f8d7da;
        box-shadow: inset 0 0 0 2px #f1b0b7;
      }
      .meta {
        font-size: 11px;
        color: #666;
        line-height: 1.4;
      }
      .empty-csat {
        margin: 8px 0 12px;
        padding: 14px 12px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        text-align: center;
        color: #7a3e00;
        background: #fff4e5;
        border: 1px solid #e8c48a;
        border-radius: 8px;
      }
      table.summary {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        table-layout: fixed;
      }
      table.summary th {
        text-align: left;
        font-size: 11px;
        color: #555;
        font-weight: 600;
        padding: 6px 8px;
        border-bottom: 1px solid #ddd;
        background: #f7f7f7;
      }
      table.summary td {
        padding: 8px;
        border-bottom: 1px solid #eee;
        vertical-align: top;
        word-wrap: break-word;
      }
      table.summary th:nth-child(1),
      table.summary td:nth-child(1) {
        width: 22%;
      }
      table.summary th:nth-child(2),
      table.summary td:nth-child(2) {
        width: 22%;
      }
      table.summary th:nth-child(3),
      table.summary td:nth-child(3) {
        width: 28%;
      }
      table.summary th:nth-child(4),
      table.summary td:nth-child(4) {
        width: 28%;
      }
      table.summary a {
        color: #0176d3;
        text-decoration: none;
        font-weight: 600;
      }
      table.summary a:hover {
        text-decoration: underline;
      }
      tr.csat-green td {
        background: #d4edda;
      }
      tr.csat-yellow td {
        background: #fff3cd;
      }
      tr.csat-red td {
        background: #f8d7da;
      }
      tr.csat-error td {
        background: #f5f5f5;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Survey History Tracking</h1>
    <div class="subtitle" id="subtitle">Most recent surveys for this Account</div>
    <div id="status" class="status">Loading…</div>
    <button id="retryBtn" hidden>Retry</button>
    <div class="account-line">
      <div id="account" class="account" hidden></div>
      <div id="avg" class="avg-badge" hidden></div>
    </div>
    <div id="results"></div>
    <script src="../content/page-context.js"></script>
    <script src="../content/html-text.js"></script>
    <script src="../content/request-number.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
